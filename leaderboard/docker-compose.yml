version: "3.8"

# ---------------------------------------------------------------------------
# CAC ABAC Workshop — Leaderboard + SAP User Provisioning
#
# Deploy on the off-grid server alongside infra/docker/docker-compose.yml
#
# Quick start:
#   1. cp .env.example .env  &&  edit .env
#   2. Unpack SAP NW RFC SDK into vendor/nwrfcsdk/
#   3. docker compose up -d --build
#   4. Open http://<server-ip>:9000
# ---------------------------------------------------------------------------

services:
  leaderboard:
    build: .
    container_name: cac-leaderboard
    restart: unless-stopped

    # host networking lets the container reach SAP RFC on 10.8.0.1:3300
    # without extra routing config
    network_mode: host

    env_file:
      - .env

    volumes:
      - leaderboard_data:/data
      # WireGuard: SSH keys for each SAP workshop server (sap2–sap5)
      - /root/.ssh/netcup_sap2:/secrets/wg_sap2_key:ro
      - /root/.ssh/netcup_sap3:/secrets/wg_sap3_key:ro
      - /root/.ssh/netcup_sap4:/secrets/wg_sap4_key:ro
      - /root/.ssh/netcup_sap5:/secrets/wg_sap5_key:ro
      # Legacy single-server key (kept for offgrid fallback / backward compat)
      - /root/.ssh/id_ed25519:/secrets/wg_ssh_key:ro
      # Level guides: mount handouts/ from the git clone so content updates = git pull only
      - /opt/cac-workshop/handouts:/handouts:ro
      # Screenshots embedded in level guides — drop .png files here, git pull picks them up
      - /opt/cac-workshop/screenshots:/screenshots:ro
      # Video walkthroughs embedded in level guides — drop .mp4 files here, git pull picks them up
      - /opt/cac-workshop/videos:/videos:ro
      # Downloadable files (policy templates, cheat sheets) — linked from level guides
      - /opt/cac-workshop/files:/files:ro
      # Level codes: mount from git clone so codes update with workshop-pull (not baked into image)
      - /opt/cac-workshop/leaderboard/level_codes.json:/data/level_codes.json:ro

    # If you want to run without the NW RFC SDK, comment out the build
    # section and use the pre-built image instead:
    # image: ghcr.io/jonathanstross/cac-abac-leaderboard:latest

volumes:
  leaderboard_data:
    name: cac_leaderboard_data
